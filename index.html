<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TEXMO Hostel Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f4fff8, #ffffff);
      color: #123b2a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(0, 80, 45, 0.12);
      border: 1px solid #dcefe4;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: #087f4f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(8, 127, 79, 0.25);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
      color: #087f4f;
    }

    .subtitle {
      color: #6b7d74;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .section-title {
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      margin: 22px 0 10px;
      color: #244c3a;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 14px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      background: #087f4f;
      color: white;
    }

    .primary:hover {
      background: #066b42;
    }

    .secondary {
      background: #e9f8f0;
      color: #087f4f;
    }

    .secondary:hover {
      background: #d9f1e5;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #9aaa9f;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dce9e1;
    }

    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #91a098;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">TH</div>

    <h1>TEXMO Hostel Hub</h1>

    <p class="subtitle">
      Smart Hostel Management System
    </p>

    <!-- LOGIN OPTIONS -->

    <div class="section-title">
      Staff Portal
    </div>

    <button class="primary" onclick="showMessage('Staff Login')">
      HR / Management / Admin Login
    </button>

    <div class="section-title">
      Employee Portal
    </div>

    <button class="secondary" onclick="showMessage('Employee Login')">
      Employee Login
    </button>

    <div class="section-title">
      Internship Portal
    </div>

    <button class="secondary" onclick="showMessage('Intern Login')">
      Intern Login
    </button>

    <div class="divider">
      Registration
    </div>

    <button class="secondary" onclick="showMessage('Staff Registration')">
      Staff Registration
    </button>

    <button class="secondary" onclick="showMessage('Employee Registration')">
      Employee Registration
    </button>

    <button class="secondary" onclick="showMessage('Intern Registration')">
      Internship Registration
    </button>

    <p class="footer">
      TEXMO Hostel Hub • Secure Hostel Management
    </p>

  </main>

  <script>
    function showMessage(type) {
      alert(type + " will be connected in the next step.");
    }
  </script>

</body>
</html>
